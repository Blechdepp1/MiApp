<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiApp Vorschau ist umgezogen</title>
    <meta http-equiv="refresh" content="0; url=/MiApp-Vorschau/" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem 1rem;
        background: #fbf6ec;
        color: #2b2b2b;
      }
      a {
        color: #2e6f60;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <p>
      Die Vorschau ist umgezogen:
      <a href="/MiApp-Vorschau/">blechdepp1.github.io/MiApp-Vorschau/</a>
    </p>
    <script>
      // Alten Service Worker der Vorschau entfernen, sonst zeigt er weiter die alte Version
      navigator.serviceWorker?.getRegistrations().then((alle) => {
        for (const r of alle) if (new URL(r.scope).pathname === '/MiApp/vorschau/') r.unregister();
      });
      location.replace('/MiApp-Vorschau/');
    </script>
  </body>
</html>
