name: Prüfen und veröffentlichen

# Jeder Push auf main: alles prüfen, dann den Testkanal /MiApp-Vorschau/ aktualisieren
# (eigenes Repository Blechdepp1/MiApp-Vorschau, Branch gh-pages).
# Milenas App /MiApp/ wird immer aus der letzten Freigabe (Git-Tag v*) gebaut und ändert
# sich deshalb erst, wenn eine neue Version freigegeben wurde (siehe docs/geraetetest.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur lesen; die Rechte zum Veröffentlichen bekommt allein der Deploy-Schritt
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # Ohne Install-Skripte von Paketen: Prüfen braucht sie nicht
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # Unit-Tests mit Abdeckungs-Untergrenzen (vite.config.ts)
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  bauen:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Testkanal bauen (aktueller Stand von main)
        run: |
          MIAPP_KANAL=vorschau npm run build
          touch dist/.nojekyll
          mv dist "$RUNNER_TEMP/vorschau"

      - name: Live-App bauen (letzte Freigabe)
        run: |
          FREIGABE=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$FREIGABE" ]; then
            echo "Noch keine Freigabe – Live-App aus main"
            npm run build
            mv dist "$RUNNER_TEMP/seite"
          else
            echo "Live-App aus $FREIGABE"
            git worktree add "$RUNNER_TEMP/live" "$FREIGABE"
            cd "$RUNNER_TEMP/live"
            npm ci
            npm run build
            mv dist "$RUNNER_TEMP/seite"
          fi
          # Alte Vorschau-Adresse /MiApp/vorschau/ leitet zur neuen um
          cp -r weiterleitung/vorschau "$RUNNER_TEMP/seite/vorschau"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/seite

      - uses: actions/upload-artifact@v4
        with:
          name: vorschau
          path: ${{ runner.temp }}/vorschau
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Testkanal ins Repository Blechdepp1/MiApp-Vorschau schieben (GitHub Pages aus gh-pages).
  # Der Deploy-Key darf nur dieses eine Repository beschreiben.
  vorschau:
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vorschau
          path: vorschau
      - name: In Blechdepp1/MiApp-Vorschau veröffentlichen
        env:
          DEPLOY_KEY: ${{ secrets.VORSCHAU_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/vorschau
          chmod 600 ~/.ssh/vorschau
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          cd vorschau
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Vorschau aus Blechdepp1/MiApp@${GITHUB_SHA::7}"
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/vorschau -o IdentitiesOnly=yes'
          git push -f -q git@github.com:Blechdepp1/MiApp-Vorschau.git gh-pages
